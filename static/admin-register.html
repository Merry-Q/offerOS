<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册管理员 · OfferOS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/auth-pages.css">
</head>
<body class="admin">
  <div class="auth-card">
    <div class="brand">OfferOS Admin</div>
    <p class="sub">首次创建管理员（仅系统尚无管理员时可用）</p>
    <form id="form">
      <label>用户名</label>
      <input id="username" required minlength="2">
      <label>密码（至少 6 位）</label>
      <input id="password" type="password" required minlength="6">
      <button type="submit">注册管理员</button>
    </form>
    <p class="msg" id="msg"></p>
    <p class="links"><a href="/admin/login">返回登录</a></p>
  </div>
<script src="/static/auth.js"></script>
<script>
(async () => {
  const boot = await fetch("/api/auth/admin-bootstrap").then((r) => r.json());
  if (!boot.can_register_admin) {
    document.getElementById("msg").textContent = "已存在管理员，请直接登录";
    document.getElementById("form").style.display = "none";
  }
})();

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "注册中…";
  try {
    const data = await fetch("/api/auth/admin-bootstrap", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      }),
    }).then(async (r) => {
      const d = await r.json();
      if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "注册失败");
      return d;
    });
    setAuth(data.token, data.user);
    location.href = "/admin";
  } catch (err) {
    msg.textContent = err.message;
  }
};
</script>
</body>
</html>
