<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · OfferOS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/auth-pages.css">
</head>
<body>
  <div class="auth-card">
    <div class="brand">OfferOS</div>
    <p class="sub">创建用户账号</p>
    <form id="form">
      <label>用户名</label>
      <input id="username" autocomplete="username" required minlength="2">
      <label>密码（至少 6 位）</label>
      <input id="password" type="password" autocomplete="new-password" required minlength="6">
      <button type="submit">注册并进入</button>
    </form>
    <p class="msg" id="msg"></p>
    <p class="links">已有账号？<a href="/login">登录</a></p>
  </div>
<script src="/static/auth.js"></script>
<script>
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "注册中…";
  try {
    const data = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      }),
    }).then(async (r) => {
      const d = await r.json();
      if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "注册失败");
      return d;
    });
    setAuth(data.token, data.user);
    location.href = "/";
  } catch (err) {
    msg.textContent = err.message;
  }
};
</script>
</body>
</html>
