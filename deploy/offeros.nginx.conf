limit_req_zone $binary_remote_addr zone=offeros_api:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=offeros_login:1m rate=5r/m;

server {
    listen 80;
    server_name offeros.47.237.109.221.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name offeros.47.237.109.221.sslip.io;
    ssl_certificate /usr/local/openresty/nginx/conf/conf.d/secure/letsencrypt/live/offeros.47.237.109.221.sslip.io/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/conf.d/secure/letsencrypt/live/offeros.47.237.109.221.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    client_max_body_size 6m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /api/auth/login {
        limit_req zone=offeros_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18000;
    }

    location /api/ {
        limit_req zone=offeros_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
    }
}
